channel_slug: Sura×Asura For AI Agent
taxonomy: AI / エージェント開発 / Sura×Asura

notebooklm:
  base_url: https://notebooklm.google.com
  notebook_name: Sura×Asura AI 12本
  notebook_per_video: true

paths:
  urls_file: ../Sura×Asura_For_AI_Agent/_urls_all.txt
  output_dir: ../Sura×Asura_For_AI_Agent
  index_file: ../Sura×Asura_For_AI_Agent/_index.md
  prompt_file: prompts/video_note_ai.txt

gemini:
  model: gemini-2.5-flash
  api_key_env: GEMINI_API_KEY
  api_keys_env: GEMINI_API_KEYS
  env_file: ../youtube_knowledge_system/GEMINI_API_KEY.env
  daily_max_requests: 20
  delay_sec: 5
  max_retries: 2
  retry_wait_sec: 15

runtime:
  headless: false
  reply_timeout_sec: 1200
  source_index_timeout_sec: 120
  delay_between_videos_sec: 90
  max_retries: 3
  batch_size: 50
  daily_max_chats: 5
  stop_on_rate_limit: true
